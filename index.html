<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e4a43">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>إدارة المستودع</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: dark-teal band on top (back, title, customer, search); one working column below. Home is a 2×2 grid of big task tiles. */
:root{
  --bg:#eef2f1; --surface:#ffffff; --ink:#132b28; --muted:#5a6f6b; --line:#d5dfdc;
  --band:#0e4a43; --band-ink:#e9f6f3; --band-soft:#1a5d55;
  --brand:#0f5c52; --brand-ink:#ffffff; --tag:#f3b33d; --tag-ink:#3a2600;
  --bad:#c0392b; --bad-bg:#fbe9e7; --warn:#a86400; --warn-bg:#fff2d9; --ok:#1e7d4f; --ok-bg:#e2f3e9;
  --t-exp:#c2410c; --t-ret:#7c3aed; --t-wh:#0f5c52; --t-st:#1d4ed8;
  --font:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:16px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1513; --surface:#14211e; --ink:#e3eeeb; --muted:#91a8a2; --line:#253836;
  --band:#0a2f2a; --band-ink:#dff3ee; --band-soft:#154640;
  --brand:#4fbfae; --brand-ink:#06201c; --tag:#f3b33d; --tag-ink:#2b1c00;
  --bad:#ff8a7a; --bad-bg:#3a1c18; --warn:#ffc266; --warn-bg:#3a2a0f; --ok:#6fd6a0; --ok-bg:#12301f;
  --t-exp:#fb923c; --t-ret:#a78bfa; --t-wh:#4fbfae; --t-st:#60a5fa; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1513; --surface:#14211e; --ink:#e3eeeb; --muted:#91a8a2; --line:#253836;
  --band:#0a2f2a; --band-ink:#dff3ee; --band-soft:#154640;
  --brand:#4fbfae; --brand-ink:#06201c; --tag:#f3b33d; --tag-ink:#2b1c00;
  --bad:#ff8a7a; --bad-bg:#3a1c18; --warn:#ffc266; --warn-bg:#3a2a0f; --ok:#6fd6a0; --ok-bg:#12301f;
  --t-exp:#fb923c; --t-ret:#a78bfa; --t-wh:#4fbfae; --t-st:#60a5fa; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;direction:rtl}
.band{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--band);color:var(--band-ink);border-radius:0 0 22px 22px;box-shadow:0 6px 18px rgb(0 0 0 / .12)}
.band-in{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:12px 14px;display:flex;flex-direction:column;gap:10px}
.title{display:flex;align-items:center;gap:10px}
.title h1{margin:0;font-size:19px;font-weight:700;flex:1;min-width:0}
.title small{opacity:.75;font-size:12px}
.back{all:unset;cursor:pointer;display:grid;place-items:center;width:38px;height:38px;border-radius:10px;background:var(--band-soft);font-size:20px}
.cust{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;background:var(--band-soft);border-radius:14px;padding:10px 12px;min-width:0}
.cust .lab{font-size:12px;opacity:.75;white-space:nowrap}
.cust .nm{font-weight:700;font-size:16px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cust .nm.none{color:var(--tag)}
.cust .nm code{font-family:var(--mono);font-size:13px;opacity:.8}
.cust .chg{font-size:13px;background:var(--tag);color:var(--tag-ink);border-radius:99px;padding:3px 10px;font-weight:600}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;font:inherit;font-size:17px;padding:12px 14px;border-radius:12px;border:0;background:var(--surface);color:var(--ink)}
.search input:focus{outline:3px solid var(--tag)}
.cam{all:unset;cursor:pointer;display:grid;place-items:center;width:50px;border-radius:12px;background:var(--tag);color:var(--tag-ink)}
.cam svg{width:24px;height:24px}
.status{font-size:13px;min-height:1.4em;margin:0;opacity:.9}
.status.err{color:var(--tag);opacity:1;font-weight:600}
.wrap{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:16px 48px;display:flex;flex-direction:column;gap:16px}
.home{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{all:unset;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;min-height:132px;position:relative;overflow:hidden}
.tile::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:6px;background:var(--c)}
.tile .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--c);color:#fff}
.tile .ic svg{width:24px;height:24px}
.tile b{font-size:18px}
.tile span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.tile:focus-visible{outline:3px solid var(--tag);outline-offset:2px}
.minor{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.minor .btn{padding:14px}
.btn{font:inherit;font-weight:600;border:0;border-radius:12px;padding:12px 14px;cursor:pointer;background:var(--brand);color:var(--brand-ink);display:inline-flex;align-items:center;gap:6px;justify-content:center;text-align:center}
.btn.ghost{background:var(--surface);color:var(--brand);border:1.5px solid var(--line)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}
.btn.danger{background:transparent;color:var(--muted);border:1.5px solid var(--line)}
.btn:focus-visible,.hit:focus-visible,.cust:focus-visible,.cam:focus-visible,.ubtn:focus-visible,.copt:focus-visible,.back:focus-visible{outline:3px solid var(--tag);outline-offset:2px}
.hint{color:var(--muted);font-size:13px;margin:0}
.hits{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.hit{all:unset;display:grid;grid-template-columns:auto 1fr;gap:2px 12px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.hit:last-child{border-bottom:0}
.hit .no{font-family:var(--mono);font-size:13px;color:var(--muted);grid-row:span 2;align-self:center}
.hit .nm{font-weight:600;min-width:0}
.hit .gp{color:var(--muted);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px}
.card h3{margin:0;font-size:17px}
.item-head{display:flex;flex-direction:column;gap:4px}
.item-head .code{font-family:var(--mono);font-size:14px;color:var(--muted)}
.item-head h2{margin:0;font-size:21px;line-height:1.35;text-wrap:balance}
.chip{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--bg);color:var(--muted);border:1px solid var(--line);width:fit-content}
.lbl{display:block;font-size:13px;color:var(--muted);font-weight:500;margin-bottom:6px}
.ugrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ubtn{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border-radius:12px;border:1.5px solid var(--line);text-align:center;font-variant-numeric:tabular-nums;min-width:0}
.ubtn b{font-size:17px}
.ubtn span{font-size:12px;color:var(--muted)}
.ubtn i{font-style:normal;font-size:12px;font-weight:600;background:var(--tag);color:var(--tag-ink);border-radius:6px;padding:0 6px}
.ubtn[aria-pressed="true"]{border-color:var(--brand);background:var(--brand);color:var(--brand-ink)}
.ubtn[aria-pressed="true"] span{color:var(--brand-ink)}
.src{font-size:11px;font-weight:600;padding:1px 7px;border-radius:99px;white-space:nowrap}
.src.co{background:var(--brand);color:var(--brand-ink)}
.src.sm{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.src.new{background:var(--tag);color:var(--tag-ink)}
.stockbox{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:10px 12px;border-radius:12px;background:var(--ok-bg);color:var(--ok);font-variant-numeric:tabular-nums}
.stockbox b{font-size:19px}
.stockbox small{color:var(--muted)}
.bcs summary{cursor:pointer;color:var(--muted);font-size:14px}
.bcs div{display:flex;flex-direction:column;gap:4px;padding-top:8px}
.bcrow{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.bcrow code{font-family:var(--mono);direction:ltr}
.count{display:flex;flex-direction:column;gap:12px;border-top:1px dashed var(--line);padding-top:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.field{display:flex;flex-direction:column;gap:4px;flex:1;min-width:130px}
.field label{font-size:13px;color:var(--muted);font-weight:500}
.field input,.field select,.field textarea{font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
.stepper{display:flex;align-items:stretch;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.stepper button{all:unset;cursor:pointer;width:46px;text-align:center;font-size:22px;font-weight:700;color:var(--brand);background:var(--bg)}
.stepper input{border:0;border-radius:0;text-align:center;font-variant-numeric:tabular-nums;min-width:0}
.total{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.total b{font-size:22px}
.log{display:flex;flex-direction:column;gap:10px}
.log-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.log-head h3{margin:0;font-size:17px}
.log-head h3 span{color:var(--muted);font-weight:500}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;padding:5px 10px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.sums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sum{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;font-variant-numeric:tabular-nums}
.sum b{display:block;font-size:19px}
.sum b.neg{color:var(--bad)} .sum b.pos{color:var(--ok)}
.sum span{font-size:12px;color:var(--muted)}
.lines{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.line{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.line .nm{font-weight:600;min-width:0}
.line .qty{font-size:18px;font-weight:700;color:var(--brand);font-variant-numeric:tabular-nums;text-align:left;white-space:nowrap}
.line .meta{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;grid-column:1/-1}
.line .acts{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.line .cname{font-size:12px;font-weight:600;color:var(--brand)}
.edit{grid-column:1/-1;display:flex;flex-direction:column;gap:10px;background:var(--bg);border-radius:12px;padding:12px}
.ba{display:grid;grid-template-columns:repeat(3,auto);gap:2px 14px;justify-content:start;font-variant-numeric:tabular-nums;grid-column:1/-1;font-size:14px}
.ba span{font-size:11px;color:var(--muted)}
.ba b.neg{color:var(--bad)} .ba b.pos{color:var(--ok)}
.badge{font-size:12px;padding:1px 8px;border-radius:99px;font-weight:600;white-space:nowrap}
.badge.bad{background:var(--bad-bg);color:var(--bad)} .badge.warn{background:var(--warn-bg);color:var(--warn)} .badge.ok{background:var(--ok-bg);color:var(--ok)}
.empty{padding:22px 16px;text-align:center;color:var(--muted)}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:13px}
.sheet{position:fixed;inset:0;z-index:20;background:rgb(0 0 0 / .45);display:flex;align-items:flex-end;justify-content:center}
.sheet-in{background:var(--surface);color:var(--ink);width:100%;max-width:680px;max-height:85%;border-radius:22px 22px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.sheet-in h3{margin:0;font-size:18px;display:flex;justify-content:space-between;align-items:center}
.clist{overflow:auto;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;min-height:60px}
.copt{all:unset;cursor:pointer;padding:12px 14px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:baseline}
.copt:last-child{border-bottom:0}
.copt code{font-family:var(--mono);font-size:13px;color:var(--muted);min-width:56px}
.copt[aria-pressed="true"]{background:var(--ok-bg);color:var(--ok);font-weight:700}
.copt span{color:var(--muted);font-size:12px;margin-inline-start:auto}
.toast{position:fixed;inset-inline:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));margin:0 auto;max-width:420px;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;text-align:center;font-weight:600;transform:translateY(160%);transition:transform .25s;z-index:30}
.toast.show{transform:none}
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pgrid .field{min-width:0}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.bandba{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.bandba div{background:var(--band-soft);border-radius:12px;padding:6px 12px;display:flex;align-items:baseline;gap:8px}
.bandba span{font-size:12px;opacity:.8}
.bandba b{font-size:20px}
.bandba b.neg{color:#ffb4a8} .bandba b.pos{color:#9be7bf}
.bandba small{opacity:.75;font-size:12px}
.bastrip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-variant-numeric:tabular-nums}
.bastrip div{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;display:flex;flex-direction:column}
.bastrip span{font-size:12px;color:var(--muted);font-weight:600}
.bastrip b{font-size:24px;line-height:1.2}
.bastrip b.neg{color:var(--bad)} .bastrip b.pos{color:var(--ok)}
.bastrip small{font-size:11px;color:var(--muted)}
.colA{display:flex;flex-direction:column;gap:16px;min-width:0}
.cols{display:flex;flex-direction:column;gap:16px}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;max-width:100%}
.tbl{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{border:1px solid var(--line);padding:6px 8px;text-align:center;white-space:nowrap;vertical-align:middle}
.tbl th{background:var(--band);color:var(--band-ink);font-weight:600;font-size:12px}
.tbl td.nm{text-align:right;white-space:normal;min-width:170px;font-weight:600}
.tbl td.mono{font-family:var(--mono);font-size:12px}
.tbl td.n{color:var(--muted);font-size:11px}
.tbl td.big{font-weight:700;font-size:14px}
.tbl tbody tr:nth-child(even) td{background:var(--bg)}
.tbl tbody tr.editing td{background:var(--warn-bg)}
.tbl td.neg{color:var(--bad);font-weight:700} .tbl td.pos{color:var(--ok);font-weight:700}
.tbl td.acts{white-space:nowrap}
.tbl td.acts .btn{margin:1px}
.tbl tfoot td{font-weight:700;background:var(--ok-bg);color:var(--ok)}
.tbl .badge{font-size:11px}
.inl{display:flex;gap:4px;align-items:center}
.inl input{font:inherit;font-size:16px;padding:4px 6px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);width:110px}
.monthw{display:flex;align-items:center;gap:8px;font-size:13px}
.monthw select{font:inherit;font-size:16px;padding:5px 10px;border-radius:10px;border:0;background:var(--band-soft);color:var(--band-ink);flex:1;max-width:220px}
.tile.wide{grid-column:1/-1;min-height:auto;flex-direction:row;align-items:center}
.tile.wide span:last-child{margin-inline-start:auto}
.dfield{direction:ltr;text-align:right;font-variant-numeric:tabular-nums;letter-spacing:.5px}
.dfield.bad{border-color:var(--bad)!important}
.row.tight{flex-wrap:nowrap;gap:8px}
.row.tight .field{min-width:0}
#card{gap:8px}
#card .item-head h2{font-size:15px;line-height:1.3}
#card .item-head{gap:2px}
#card .chip{display:none}
#card .bastrip b{font-size:17px}
#card .bastrip small{display:none}
#card .count{gap:8px;padding-top:8px}
#card .ubtn{padding:5px 2px}
#card .ubtn b{font-size:14px}
#card .ubtn span{font-size:11px}
#card .field label{font-size:12px}
#card .bcs{font-size:12px}
.back{width:auto!important;padding:0 12px;font-size:14px!important;font-weight:700;background:var(--tag)!important;color:var(--tag-ink)}
.tbl tr.grp td{background:var(--ok-bg)!important;color:var(--ink);font-weight:700}
.tbl td.sub{font-weight:400;padding-inline-start:20px;color:var(--muted)}
.tbl tr.cgrp{cursor:pointer}
.tbl tr.cgrp.open td{background:var(--ok-bg)!important;font-weight:700}
.tbl tr.cin>td{padding:4px;background:var(--bg)!important}
.tbl tr.cin .tbl th{background:var(--band-soft)}
.cacc{display:flex;flex-direction:column;gap:8px}
.cblock{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cblock.open{border:2px solid var(--brand);box-shadow:0 4px 14px rgb(0 0 0 / .12);margin-block:4px}
.chead{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:10px 12px}
.cblock.open .chead{background:var(--band);color:var(--band-ink)}
.cblock.open .chead .cn small,.cblock.open .chead .cv small,.cblock.open .chead .arw{color:var(--band-ink);opacity:.8}
.cblock.open .chead .cv b{color:var(--tag)}
.cblock.open .chead .cn b::after{content:' · مفتوح';font-weight:400;font-size:11px;color:var(--tag)}
.chead .arw{color:var(--muted);font-size:12px}
.chead .cn{display:flex;flex-direction:column;min-width:0}
.chead .cn b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chead .cn small{font-size:11px;color:var(--muted)}
.chead .cn i{font-style:normal;color:var(--warn);font-weight:600}
.chead .cv{display:flex;flex-direction:column;align-items:center;min-width:44px;font-variant-numeric:tabular-nums}
.chead .cv b{font-size:16px;color:var(--brand)}
.chead .cv small{font-size:10px;color:var(--muted)}
.chead:focus-visible{outline:3px solid var(--tag);outline-offset:-3px}
.cbody{border:0;border-top:1px solid var(--line);border-radius:0}
.cblock.open{border:3px solid var(--tag)!important;background:color-mix(in srgb,var(--tag) 10%,var(--surface))}
.cblock.open .chead{background:var(--band)!important;color:var(--band-ink)}
.cblock.open .chead .cv b{color:var(--tag);font-size:18px}
.cblock.open .chead .cn b::after{color:var(--tag);font-weight:700}
.cblock.open .cbody .tbl th{background:var(--band-soft)}
.cacc:has(.cblock.open) .cblock:not(.open){opacity:.6}
#retHead .dfield,#retHead #q2{height:40px;padding:6px 10px;font-size:15px}
#retHead .cam{height:40px}
#retHead #rd{font-size:14px!important;letter-spacing:0;padding:4px 6px!important;width:calc(10ch + 16px);text-align:center;direction:ltr}
.camw{position:relative;overflow:hidden}
.camin{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;font-size:0}
#rc{height:40px;padding:6px 10px;font-size:15px}
#rc.picked{font-weight:700;background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.rclist{position:absolute;inset-inline:0;top:42px;z-index:15;background:var(--surface);border:1.5px solid var(--brand);border-radius:10px;box-shadow:0 8px 20px rgb(0 0 0 / .18);max-height:300px;overflow:auto;display:flex;flex-direction:column}
.rclist .copt{padding:10px 12px}
#retHead~#card .ugrid:has(.ubtn:only-child){grid-template-columns:1fr}
.invbox{display:flex;flex-direction:column;gap:8px;background:var(--bg);border-radius:10px;padding:8px}

  const d=toLatin(str||'').replace(/[^\d]/g,'');if(!d)return'';
  let dd,mm,yy;
  if(d.length===8){dd=d.slice(0,2);mm=d.slice(2,4);yy=d.slice(4)}
  else if(d.length===6&&Number(d.slice(2))>=2000){dd='01';mm=d.slice(0,2);yy=d.slice(2)}

async function saveOverride(no,patch,replaceLists){

}

// ---------- excel import/export ----------
let xl;
function loadXL(){return xl||(xl=new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=()=>ok(window.XLSX);s.onerror=no;document.head.appendChild(s)}))}
async function readSheet(file){const X=await loadXL();const wb=X.read(await file.arrayBuffer());const ws=wb.Sheets[wb.SheetNames[0]];return X.utils.sheet_to_json(ws,{defval:'',raw:false})}
const exactCol=(row,...keys)=>{for(const k of Object.keys(row)){const n=norm(k);if(keys.some(x=>n===norm(x)))return String(row[k]).trim()}return''};
const col=(row,...keys)=>{for(const k of Object.keys(row)){const n=norm(k);if(keys.some(x=>n.includes(norm(x))))return String(row[k]).trim()}return''};
async function importCustomers(e){
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const rows=await readSheet(f);let n=0,u=0;status('أستورد العملاء…');
    for(const r of rows){const code=toLatin(col(r,'رقم العميل','رقم','كود','code','customer')),name=col(r,'اسم العميل','الاسم','اسم','name');if(!name)continue;
      const ex=code?customers.find(c=>c.code===code):null;
      if(ex){if(ex.name!==name){await store.update('customers',ex.id,{name});u++}}else{await store.set('customers',code?cid(code):'n'+Date.now()+n,{code,name,at:Date.now(),by:myId||''});n++}
      if((n+u)%20===0)status('أستورد… '+(n+u));}
    status('');toast(`انضاف ${n} عميل، وتحدّث ${u}`);
  }catch(err){status('ما قدرت أقرأ الملف. تأكد إن فيه عمود «اسم العميل».',true)}
}
function hasKey(r,...ks){return Object.keys(r).some(k=>{const n=norm(k);return ks.some(x=>n.includes(norm(x)))})}
function parseItemRow(r){
  const no=toLatin(col(r,'رقم الصنف','رقم المادة','المادة','كود الصنف','item','matnr')||exactCol(r,'الكود','كود','الرقم')).replace(/\s/g,'');if(!/^\d+$/.test(no))return null;
  const out={no,name:col(r,'اسم الصنف','اسم المنتج','الوصف','الاسم','name')||exactCol(r,'الصنف','صنف'),price:{},bcs:[],conv:{}};
  const unitPriced=Object.keys(r).some(k=>{const n=norm(k);return n.includes('سعر')&&UNITS.some(u=>n.includes(norm(u)))});
  for(const un of UNITS){const p=num(col(r,'سعر ال'+un,'سعر '+un));if(p!=null)out.price[un]=p;
    const bc=toLatin(col(r,'باركود ال'+un,'باركود '+un));if(bc)out.bcs.push({bc,unit:un})}
  if(!unitPriced&&hasKey(r,'سعر','price')){const p=num(col(r,'سعر','price'));if(p!=null)out.price['كرتون']=p}
  const cb=num(col(r,'حبات بالعلبة')),cc=num(col(r,'حبات بالكرتون'));if(cb!=null)out.conv['علبة']=cb;if(cc!=null)out.conv['كرتون']=cc;
  out.stock=num(col(r,'المخزون','الكمية','الرصيد','stock','qty'));
  {const pp=num(col(r,'في الطبلية','بالطبلية','الطبلية','طبلية','طبالي'));if(pp>0)out.ppl=pp}
  return out;
}
async function applyItemRows(parsed){
  let n=0,u=0,i=0;const W=[];
  for(const p of parsed){
    const it=coItems.find(x=>x.item===p.no);if(!it&&!p.name)continue;
    const o=overrides.get(p.no)||{},price={...(o.price||{}),...p.price},conv={...(o.conv||{}),...p.conv},bcs=[...(o.bcs||[])];
    for(const b of p.bcs)if(!bcs.some(x=>x.bc===b.bc))bcs.push(b);
    const doc={...o,item:p.no,price,conv,bcs};if(p.name&&(!it||it.isNew||o.name))doc.name=p.name;if(!it&&p.name)doc.name=p.name;if(p.stock!=null)doc.stock=p.stock;if(p.ppl)doc.ppl=p.ppl;
    W.push(['i'+String(p.no).replace(/[^A-Za-z0-9_-]/g,'_'),doc]);it?u++:n++;
  }
  if(db&&db.batch){
    for(let k=0;k<W.length;k+=400){const b=db.batch();for(const [id,d] of W.slice(k,k+400))b.set(db.collection('items').doc(id),d);status('أحفظ… '+Math.min(k+400,W.length)+' من '+W.length);await b.commit()}
  }else{for(const [id,d] of W){await store.set('items',id,d);if(++i%10===0)status('أحفظ… '+i+' من '+W.length)}}
  status('');return{n,u};

const PASTE_DEFAULT=['رقم الصنف','اسم الصنف','المخزون','سعر الكرتون'];
function parsePaste(text){

  const sp=l=>l.includes('\t')?l.split('\t'):l.split(/\s*[;,]\s*|\s{2,}/);

  const rows=(isHdr?lines.slice(1):lines).map(l=>{const c=sp(l);const o={};hdr.forEach((h,i)=>{if(h)o[h]=(c[i]??'').trim()});return o});

function pasteRows(txt,html){

  if(!rows.length){const lines=txt.replace(/\r/g,'').split('\n').filter(l=>l.trim());
    if(txt.includes('\t'))rows=lines.map(l=>l.split('\t').map(x=>x.trim()));
    else{const cells=lines.map(x=>x.trim());for(let k=0;k<cells.length;k+=4)rows.push(cells.slice(k,k+4))}}
  if(!rows.length)return[];

  const isHead=r=>r.some(v=>/^(ال)?(كود|صنف|كمية|سعر|رقم|اسم|طبل|طبال)/.test(norm(v)))&&!r.some(v=>/^\d{5,}$/.test(toLatin(v).replace(/[,\s]/g,'')));
  let map=null;

    map=[f(/كود|رقم/),f(/صنف|اسم|وصف/),f(/كميه|مخزون|رصيد/),f(/سعر/),f(/طبل|طبال/)]}

async function decode(file){
  if('BarcodeDetector' in window){try{const bd=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','code_39','itf']});const r=await bd.detect(await createImageBitmap(file));if(r[0])return r[0].rawValue}catch(e){}}

  const hints=new Map();hints.set(Z.DecodeHintType.TRY_HARDER,true);
  hints.set(Z.DecodeHintType.POSSIBLE_FORMATS,[Z.BarcodeFormat.EAN_13,Z.BarcodeFormat.EAN_8,Z.BarcodeFormat.UPC_A,Z.BarcodeFormat.UPC_E,Z.BarcodeFormat.CODE_128,Z.BarcodeFormat.CODE_39,Z.BarcodeFormat.ITF]);

    const s=Math.min(1,max/Math.max(img.width,img.height)),w=Math.round(img.width*s),h=Math.round(img.height*s);
    const c=document.createElement('canvas'),x=c.getContext('2d',{willReadFrequently:true});
    if(rot){c.width=h;c.height=w;x.translate(h,0);x.rotate(Math.PI/2)}else{c.width=w;c.height=h}
    x.drawImage(img,0,0,w,h);

    try{return reader.decode(new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.RGBLuminanceSource(lum,c.width,c.height)))).getText()}catch(e){}
  }

}

    const kind=swForm.from&&swForm.to?'swap':'note';const pt=swForm.pt||'rep';if(pt==='cust'&&!swForm.cust){toast('اختر العميل');$('#swcust').focus();return}if(pt==='mini'&&!$('#swc').value.trim()){toast('اكتب اسم الميني ماركت');$('#swc').focus();return}const prep=pt==='rep'?swForm.rep:pt==='cust'?-1:-2;const cname=pt==='cust'?swForm.cust.name:pt==='mini'?$('#swc').value.trim():'';
    try{const nid=await store.add('swaps',{kind,date:d,rep:prep,repName:prep>=0?(repNames[prep]||''):(prep===-1?'عميل جملة':'ميني ماركت'),custName:cname,custId:pt==='cust'?swForm.cust.id:'',custCode:pt==='cust'?swForm.cust.code:'',from:swForm.from||null,to:swForm.to||null,q,text,voice:!!swVoice,by:myId||'',at:Date.now()});
      if(swVoice&&nid)await store.set('voices',nid,{...swVoice,entryId:nid,at:Date.now()});swVoice=null;toast('انسجل');swForm={rep:swForm.rep,pt:swForm.pt,cust:swForm.cust,mini:swForm.mini,date:d,from:null,to:null,kind:'swap'};renderSwap()}catch(_){toast('ما انسجل، حاول مرة ثانية')}};
  $('#main').querySelectorAll('[data-swdel]').forEach(b=>b.onclick=async()=>{if(b.dataset.c!=='1'){b.dataset.c='1';b.textContent='متأكد؟';return}try{const x=swaps.find(w=>w.id===b.dataset.swdel);if(x?.voice){try{await store.del('voices',x.id)}catch(_){}}await store.del('swaps',b.dataset.swdel);toast('انحذف')}catch(_){toast('صار خطأ')}renderSwap()});
  dbBanner();
}

function refHint(item){const L=swaps.filter(w=>w.kind==='ref'&&w.date===whDate&&w.from.item===item);if(!L.length)return'';const q=L.reduce((a,w)=>a+(Number(w.q)||0),0);
  return `<div class="refh">↩ رفض المندوب <b>+${fmt(q)}</b> كرتون رجع للمستودع · ${esc([...new Set(L.map(w=>repNames[w.rep]||w.repName))].join('، '))}</div>`}

// ---------- pallets via WhatsApp ----------
function pltGroups(){const m=new Map();for(const it of coItems){const k=simKey(it.name);const key='#'+it.item;if(!m.has(key))m.set(key,[]);m.get(key).push(it)}
  return[...m.values()].map(L=>L.sort((a,b)=>a.item.localeCompare(b.item))).sort((a,b)=>a[0].name.localeCompare(b[0].name,'ar'))}
function pltText(){const G=pltGroups();
  return'السلام عليكم، اكتب عدد *الكراتين في الطبلية* لكل صنف بعد علامة = ورجّع الرسالة:\n\n'+G.map(L=>{const v=L.find(x=>x.ppl)?.ppl;const nm=L.length>1?simName(L):L[0].name;
    return`${L[0].item} ${nm}${L.length>1?' ('+L.length+' نكهات)':''} = ${v||''}`}).join('\n')}
function simName(L){const w=L.map(x=>x.name.split(/\s+/));const c=[];for(let i=0;i<w[0].length;i++){if(w.every(a=>a[i]===w[0][i]))c.push(w[0][i]);else break}
  const size=(L[0].name.match(/\S*\d+\s*[xX×*]\s*\d+\S*/)||[''])[0];const base=c.join(' ')||L[0].name.split(/\s+/).slice(0,2).join(' ');return base.includes(size)?base:base+' '+size}
function showPltWa(box){
  box.innerHTML=`<div class="card pltwa"><b>كرتون في الطبلية عن طريق الواتساب</b>
    <p class="hint">١) أرسل القائمة لأمين المستودع. ٢) يكتب الرقم بعد = ويرجّعها. ٣) انسخ رده والصقه هنا واضغط حفظ.</p>
    <div class="row"><button class="btn ap" type="button" id="pwSend">📲 أرسل للواتساب</button><button class="btn ghost" type="button" id="pwCopy">نسخ القائمة</button><button class="btn ghost" type="button" id="pwClose">إغلاق</button></div>
    <textarea id="pwIn" rows="6" placeholder="الصق رد أمين المستودع هنا"></textarea>
    <div class="row"><button class="btn" type="button" id="pwSave">حفظ الأرقام</button><span class="hint" id="pwInfo"></span></div></div>`;
  const txt=pltText();
  $('#pwClose').onclick=()=>box.innerHTML='';
  $('#pwCopy').onclick=async()=>{try{await navigator.clipboard.writeText(txt);toast('انسخت، الصقها في الواتساب')}catch(_){const t=$('#pwIn');t.value=txt;t.select();toast('حدد النص وانسخه')}};
  $('#pwSend').onclick=async()=>{if(navigator.share){try{await navigator.share({text:txt});return}catch(e){if(e&&e.name==='AbortError')return}}
    const u='https://wa.me/?text='+encodeURIComponent(txt);if(u.length<8000)window.open(u,'_blank');else $('#pwCopy').click()};
  $('#pwSave').onclick=async()=>{const G=pltGroups(),by=new Map();for(const L of G)for(const it of L)by.set(it.item,L);
    const done=new Set();let n=0,bad=0;
    for(const line of $('#pwIn').value.split(/\r?\n/)){const l=toLatin(line);const m=l.match(/(\d{5,})/),v=l.match(/=\s*\*?([\d.]+)\s*\*?\s*$/);if(!m||!v)continue;
      const L=by.get(m[1]),pp=Number(v[1]);if(!L||!(pp>0)||done.has(L))continue;done.add(L);
      for(const it of L){if(it.ppl===pp)continue;try{await saveOverride(it.item,{ppl:pp});n++}catch(_){bad++}}}
    $('#pwInfo').textContent=done.size?`انحفظ ${done.size} سطر (${n} صنف)`+(bad?` · ما انحفظ ${bad}`:''):'ما لقيت أرقام. تأكد إن الرقم بعد علامة =';
    if(done.size)toast('✓ انحفظت أرقام الطبالي')};
}

var ilq='';
function drawItemList(){const box=$('#itemList');if(!box)return;
  const v=wq(ilq).trim(),t=v.split(' ').filter(Boolean);
  const L=coItems.filter(it=>!t.length||it.item.includes(v)||t.every(w=>tokOk(it,w))).sort((a,b)=>a.name.localeCompare(b.name,'ar'));
  const had=document.activeElement?.id==='ilq';
  box.innerHTML=`${t.length?`<div class="ilhead"><span class="hint">${L.length} من ${coItems.length} صنف</span></div>`:''}
    ${coItems.length?`<div class="tblwrap"><table class="tbl iltab"><thead><tr><th>الكود</th><th>اسم الصنف</th><th>السعر</th><th>مع<br>الضريبة</th><th>مخزون</th><th>طبالي</th></tr></thead><tbody>
    ${L.map(it=>`<tr data-il="${esc(it.item)}"><td class="mono">${esc(it.item)}</td><td class="nm">${esc(it.name)}</td><td>${it.price['كرتون']!=null?money(it.price['كرتون']):'—'}</td><td class="vat">${it.price['كرتون']!=null?money(it.price['كرتون']*1.15):'—'}</td><td>${fmt(it.stock)}</td><td>${it.ppl?fmt(it.ppl):'—'}</td></tr>`).join('')}</tbody></table></div>`
    :'<div class="lines"><div class="empty">ما فيه أصناف بعد. الصقها من «لصق من Excel» أو «تحديث المخزون».</div></div>'}`;
  box.querySelectorAll('[data-il]').forEach(r=>r.onclick=()=>{const it=coItems.find(x=>x.item===r.dataset.il);if(it){itemEditor(it);window.scrollTo({top:0})}});
}

function sizeKey(name){const n=toLatin(norm(name)).replace(/×|\*/g,'x');const m=n.match(/\d+(?:\s*x\s*[\d.()+]+)+\s*(?:g|gm|جم|ج)?/i);return m?m[0].replace(/\s/g,'').toLowerCase():''}
function sibsOf(it){const sz=sizeKey(it.name);if(!sz)return[];const w=norm(it.name).split(' ').filter(x=>x.length>1).slice(0,2).join(' ');const pk=/\((علب|كيس)\)/.exec(it.name)?.[1]||'';
  return coItems.filter(x=>x.item!==it.item&&sizeKey(x.name)===sz&&norm(x.name).split(' ').filter(y=>y.length>1).slice(0,2).join(' ')===w&&(/\((علب|كيس)\)/.exec(x.name)?.[1]||'')===pk)}
async function pplSiblings(it,pp){let n=0;for(const x of sibsOf(it)){if(x.ppl===pp)continue;try{await saveOverride(x.item,{ppl:pp});n++}catch(_){}}return n}

function nearDayTbl(d){const G=new Map();for(const r of d.rows){const k=r.item+'|'+(r.expiry||'');let o=G.get(k);if(!o){o={item:r.item,name:r.name,expiry:r.expiry,tot:0,per:new Map()};G.set(k,o)}o.tot+=r.q;o.per.set(r.rep,(o.per.get(r.rep)||0)+r.q)}
  return `<div class="daybody"><div class="tbl-wrap"><table class="tbl nldt"><thead><tr><th>الكود</th><th>الصنف</th><th>الكمية</th></tr></thead><tbody>${[...G.values()].map(o=>{const ik='n|'+d.date+'|'+o.item+'|'+(o.expiry||''),io=ldOpen.has(ik);
    return `<tr class="nlg${io?' open':''}" data-ldk="${esc(ik)}"><td class="mono">${esc(o.item)}</td><td class="nm"><span class="arr">${io?'▾':'◂'}</span> ${esc(o.name)}${o.expiry?`<div class="hint">ينتهي ${toDisp(o.expiry)}</div>`:''}</td><td class="big">${fmt(Math.round(o.tot*1000)/1000)}</td></tr>`+
      (io?[...o.per].map(([rp,q])=>`<tr class="nlr"><td></td><td class="nm">👤 ${esc(repNames[rp]||('مندوب '+(rp+1)))}</td><td>${fmt(Math.round(q*1000)/1000)}</td></tr>`).join(''):'')}).join('')}</tbody></table></div></div>`}

function nearOpen(rows0){const LB=new Map();for(const l of loads)for(const x of l.items||[]){const k=x.item+'|'+(x.expiry||'');let o=LB.get(k);if(!o){o={left:0,per:new Map()};LB.set(k,o)}const q=Number(x.q)||0;o.left+=q;o.per.set(l.rep,(o.per.get(l.rep)||0)+q)}
  return rows0.map(r=>{const k=r.e.item+'|'+(r.e.expiry||''),o=LB.get(k),qty=r.e.cartons??r.e.qty;let got=0;if(o&&o.left>0){got=Math.min(o.left,qty);o.left-=got}return{...r,qty,got,rem:Math.round((qty-got)*1000)/1000,per:o?.per}}).filter(r=>r.rem>0.0005)}

document.addEventListener('input',e=>{if(!e.target.classList?.contains('dein'))return;const ins=[...document.querySelectorAll('.dein')],sum=Math.round(ins.reduce((a,i)=>a+(num(i.value)||0),0)*1000)/1000,q=Number(ins[0].dataset.q)||0,el=$('#dsum');if(el){el.textContent=fmt(sum);el.className=Math.abs(sum-q)<1e-6?'pos':'neg'}const m=$('#dmsg');if(m)m.textContent=''});

var logFilterName='';
function scopedSearch(o){const q=$('#q2'),D=$('#nql');if(!q||!D)return;q.parentElement.parentElement.style.position='relative';q.placeholder=o.ph;const g=o.get();if(g)q.value=g[1];
  q.oninput=()=>{const raw=q.value.trim(),v=wq(raw);if(o.get()){o.set('','');renderLog()}if($('#card')&&!$('#card').hidden)closeCard();
    if(!v){D.hidden=true;return}
    if(/^\d{8,}$/.test(toLatin(raw))){D.hidden=true;run(raw);return}
    const m=o.items(),ok=(c,n)=>c.includes(v)||v.split(' ').filter(Boolean).every(t=>tokOk({name:n},t));
    const hit=[...m].filter(([c,n])=>ok(c,n)).slice(0,15);
    const st=coItems.filter(it=>!m.has(it.item)&&(it.item.includes(v)||v.split(' ').filter(Boolean).every(t=>tokOk(it,t)))).slice(0,8);
    D.innerHTML=(hit.length?`<div class="sqh">في الصفحة</div>`+hit.map(([c,n])=>`<button type="button" class="copt" data-npick="${esc(c)}"><code>${esc(c)}</code>${esc(n)}</button>`).join(''):'')
      +(st.length?`<div class="sqh reg">＋ ${o.reg}</div>`+st.map(it=>`<button type="button" class="copt sreg" data-sreg="${esc(it.item)}"><code>${esc(it.item)}</code>${esc(it.name)}</button>`).join(''):'')
      +(!hit.length&&!st.length?'<div class="empty" style="padding:10px">ما لقيت صنف</div>':'');D.hidden=false};
  D.onmousedown=e=>e.preventDefault();
  D.onclick=e=>{const b=e.target.closest('[data-npick],[data-sreg]');if(!b)return;D.hidden=true;
    if(b.dataset.npick){const c=b.dataset.npick,n=b.textContent.replace(c,'').trim();o.set(c,n);q.value=n;q.blur();renderLog();return}
    const it=coItems.find(x=>x.item===b.dataset.sreg);if(it){q.value='';status('');openItem(it)}};
  q.addEventListener('blur',()=>setTimeout(()=>{D.hidden=true},150))}

// ---------- pull to refresh ----------
(function(){let y0=null,d=0,el=null;const top=()=>(window.scrollY||0)<=2&&(document.scrollingElement||document.documentElement).scrollTop<=2;
  const ind=()=>{if(!el){el=document.createElement('div');el.id='ptr';el.innerHTML='<span>↻</span><b>اسحب للتحديث</b>';document.body.appendChild(el)}return el};
  addEventListener('touchstart',e=>{if(e.touches.length===1&&top()&&!e.target.closest('input,textarea,select,.lsl,.rclist,.tbl-wrap,.pprev')){y0=e.touches[0].clientY;d=0}else y0=null},{passive:true});
  addEventListener('touchmove',e=>{if(y0==null)return;d=e.touches[0].clientY-y0;if(d<=0||!top()){ind().style.transform='translate(-50%,-80px)';return}const k=Math.min(d,140);const i=ind();i.style.transform=`translate(-50%,${k*0.6-60}px)`;i.classList.toggle('go',d>100);i.querySelector('b').textContent=d>100?'اترك للتحديث':'اسحب للتحديث';i.querySelector('span').style.transform=`rotate(${k*2.5}deg)`},{passive:true});
  addEventListener('touchend',()=>{if(y0==null)return;const i=el;y0=null;if(!i)return;if(d>100){i.classList.add('spin');i.querySelector('b').textContent='جاري التحديث…';i.style.transform='translate(-50%,16px)';setTimeout(()=>{doRefresh();i.classList.remove('spin');i.style.transform='translate(-50%,-80px)'},400)}else i.style.transform='translate(-50%,-80px)';d=0});
})();

function doRefresh(){const b=$('#rfBtn');if(b)b.classList.add('spin');try{if($('#card')&&!$('#card').hidden&&!editEntry)closeCard();render()}catch(_){}setTimeout(()=>{if(b)b.classList.remove('spin');toast('✓ تم التحديث')},500)}
document.addEventListener('click',e=>{if(e.target.closest('#rfBtn'))doRefresh()});

</script>
